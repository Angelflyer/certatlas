name: One-off fetch of CERT-EU hall of fame
on:
  push:
    branches: [claude/fetch-hall-of-fame]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and print page text
        run: |
          curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) Chrome/128.0 Safari/537.36" https://cert.europa.eu/hall-of-fame -o hof.html
          echo "BYTES $(wc -c < hof.html)"
          python3 - <<'PY'
          import re, html
          s = open("hof.html", encoding="utf-8", errors="replace").read()
          s = re.sub(r"(?is)<(script|style|noscript)[^>]*>.*?</\1>", " ", s)
          # keep flag/country hints from img alt/title and class names
          s = re.sub(r'(?is)<img[^>]*?(?:alt|title)="([^"]*)"[^>]*>', r" [img:\1] ", s)
          s = re.sub(r'(?is)<span[^>]*class="[^"]*(fi[-_ ][a-z]{2}|flag[-_ ][a-z]{2})[^"]*"[^>]*>', r" [flag:\1] ", s)
          s = re.sub(r"(?is)<(br|/p|/div|/li|/tr|/h\d)[^>]*>", "\n", s)
          s = re.sub(r"(?s)<[^>]+>", " ", s)
          s = html.unescape(s)
          lines = [re.sub(r"[ \t]+", " ", l).strip() for l in s.split("\n")]
          print("\n".join(l for l in lines if l))
          PY
