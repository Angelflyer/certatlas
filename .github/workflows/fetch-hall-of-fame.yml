name: One-off fetch of CERT-EU hall of fame
on:
  push:
    branches: [claude/fetch-hall-of-fame]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download page and save it to the branch
        run: |
          mkdir -p tmp-hof
          curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) Chrome/128.0 Safari/537.36" https://cert.europa.eu/hall-of-fame -o tmp-hof/hall-of-fame.html
          wc -c tmp-hof/hall-of-fame.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-hof
          git commit -m "Temporary: raw hall of fame page [skip ci]"
          git push
